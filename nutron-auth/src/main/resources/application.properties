spring.application.name=nutron-auth
server.port=8081

# Configuración para la Base de Datos en Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:3306/${DB_NAME:users_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root_password}

# Esto ayuda a Hibernate a no tener que "adivinar" el dialecto si la red está lenta
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Crear tablas automáticamente basado en tus clases Java
spring.jpa.hibernate.ddl-auto=update